name: 不具合の報告 / Bug report
description: 記録されない、記録の中身がおかしい、HDT がエラーを出すなど / The plugin does not record, records wrong data, or errors
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。日本語でも英語でもかまいません（Japanese or English is fine）。

        > **`*.power.log.gz`（Power.log の写し）は添付しないでください。** 同じロビーの全員の BattleTag が入っています。
        > Do **not** attach `*.power.log.gz`: it contains every lobby player's BattleTag.

  - type: input
    id: plugin-version
    attributes:
      label: プラグインのバージョン / Plugin version
      description: HDT の Options > Tracker > Plugins の一覧に出ている版
      placeholder: "0.11.0"
    validations:
      required: true

  - type: input
    id: hdt-version
    attributes:
      label: HDT のバージョン / HDT version
      description: "`%LOCALAPPDATA%\\HearthstoneDeckTracker\\` にある `app-<version>` フォルダの版（複数あるときは大きいほう）"
      placeholder: "1.59.7"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: モード / Mode
      description: デュオは今のところ記録の対象外です / Duos is not supported yet
      options:
        - ソロ / Solo
        - デュオ / Duos
        - 分からない・関係ない / Unknown or not relevant
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 起きたこと / What happened
      description: 何をしたら、何が起きたか。記録の中身がおかしいときは、どのターンのどのキーか
      placeholder: |
        例: 3 ターン目に売ったミニオンが actions.sells に入っていない
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待したこと / Expected behavior
    validations:
      required: false

  - type: textarea
    id: plugin-log
    attributes:
      label: plugin.log の該当部分 / Relevant part of plugin.log
      description: |
        `%APPDATA%\HearthstoneDeckTracker\HsbgKansousen\plugin.log` のうち、そのゲームの前後（ERROR の行とその周り）。
        パスに Windows のユーザー名が入るので、`C:\Users\<名前>\` の名前は伏せてください（例: `C:\Users\user\`）。
        Please mask your Windows user name in paths.
      render: text
    validations:
      required: false

  - type: textarea
    id: game-log
    attributes:
      label: 記録の JSON（任意）/ Game log JSON (optional)
      description: |
        添付するときは `.json` だけを、`scripts/anonymize_log.py` で日時・MMR を置き換えてから付けてください。
        例: `python scripts\anonymize_log.py <log.json> --out <folder>`。events.jsonl と power.log(.gz) は付けないでください。
        Attach only `.json` logs, after running `scripts/anonymize_log.py`.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 確認 / Checks
      options:
        - label: "`*.power.log.gz` / Power.log を添付していない（I did not attach a Power.log）"
          required: true
        - label: 貼ったログのパスのユーザー名を伏せた、またはパスを貼っていない（I masked my user name in pasted paths）
          required: true
